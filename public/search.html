<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitPreview - Search Results</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      min-height: 100vh;
      color: #e6edf3;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      margin-bottom: 30px;
      border-bottom: 1px solid #21262d;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, #58a6ff, #3fb950);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: #8b949e;
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #e6edf3;
    }

    .search-container {
      margin-bottom: 30px;
    }

    .search-box {
      display: flex;
      gap: 12px;
      background: #21262d;
      border-radius: 12px;
      padding: 16px;
    }

    .search-input {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      outline: none;
    }

    .search-input:focus {
      border-color: #58a6ff;
    }

    .btn {
      padding: 12px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(90deg, #238636, #2ea043);
      color: white;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .results-count {
      color: #8b949e;
    }

    .sort-options {
      display: flex;
      gap: 10px;
    }

    .sort-btn {
      padding: 6px 12px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #8b949e;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .sort-btn:hover,
    .sort-btn.active {
      background: #30363d;
      color: #e6edf3;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .project-card {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      transition: all 0.2s;
    }

    .project-card:hover {
      border-color: #58a6ff;
      transform: translateY(-4px);
    }

    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .project-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
    }

    .project-name:hover {
      text-decoration: underline;
    }

    .project-stars {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #e3b341;
      font-size: 0.9rem;
    }

    .project-desc {
      color: #8b949e;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .project-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      color: #8b949e;
    }

    .language-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .topics {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .topic-tag {
      padding: 2px 8px;
      background: #1f6feb22;
      border: 1px solid #1f6feb;
      border-radius: 12px;
      font-size: 0.75rem;
      color: #58a6ff;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
    }

    .page-btn {
      padding: 8px 16px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      cursor: pointer;
    }

    .page-btn:hover {
      background: #30363d;
    }

    .page-btn.active {
      background: #1f6feb;
      border-color: #1f6feb;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }

    .spinner {
      border: 3px solid #30363d;
      border-top: 3px solid #58a6ff;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }

    .preview-btn {
      display: inline-block;
      padding: 6px 12px;
      background: #238636;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      margin-top: 10px;
    }

    .preview-btn:hover {
      background: #2ea043;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">GitPreview</div>
      <nav class="nav-links">
        <a href="/">Discover</a>
        <a href="/search" class="active">Search</a>
        <a href="/favorites">Favorites</a>
      </nav>
    </header>

    <div class="search-container">
      <div class="search-box">
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="Search GitHub repositories..."
        >
        <button class="btn btn-primary" onclick="handleSearch()">Search</button>
      </div>
    </div>

    <div class="results-header">
      <div class="results-count" id="resultsCount"></div>
      <div class="sort-options">
        <button class="sort-btn active" onclick="sortResults('stars')">Stars</button>
        <button class="sort-btn" onclick="sortResults('forks')">Forks</button>
        <button class="sort-btn" onclick="sortResults('updated')">Updated</button>
      </div>
    </div>

    <div id="searchResults" class="projects-grid">
      <div class="loading">
        <div class="spinner"></div>
        <p>Searching...</p>
      </div>
    </div>

    <div id="pagination" class="pagination"></div>
  </div>

  <script>
    const API_BASE = '';
    let currentQuery = '';
    let currentSort = 'stars';
    let currentPage = 1;

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    function init() {
      const params = new URLSearchParams(window.location.search);
      currentQuery = params.get('q') || '';
      const category = params.get('category');

      if (currentQuery) {
        document.getElementById('searchInput').value = currentQuery;
        performSearch();
      } else if (category) {
        searchByCategory(category);
      }
    }

    async function handleSearch() {
      currentQuery = document.getElementById('searchInput').value.trim();
      if (!currentQuery) return;

      currentPage = 1;
      await performSearch();
    }

    async function performSearch() {
      const container = document.getElementById('searchResults');
      container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Searching...</p></div>';

      try {
        const response = await fetch(
          `${API_BASE}/api/search?q=${encodeURIComponent(currentQuery)}&page=${currentPage}&sort=${currentSort}`
        );
        const data = await response.json();

        if (data.success) {
          document.getElementById('resultsCount').textContent =
            `${data.data.totalCount.toLocaleString()} repositories found`;

          renderProjects(container, data.data.projects);
          renderPagination(data.data.totalCount, data.data.page, data.data.perPage);
        } else {
          container.innerHTML = '<div class="empty-state">No results found</div>';
        }
      } catch (error) {
        container.innerHTML = '<div class="empty-state">Search failed</div>';
      }
    }

    async function searchByCategory(categoryId) {
      try {
        const response = await fetch(`${API_BASE}/api/categories`);
        const data = await response.json();

        if (data.success) {
          const category = data.data.categories.find(c => c.id === categoryId);
          if (category) {
            currentQuery = category.name;
            document.getElementById('searchInput').value = currentQuery;
            await performSearch();
          }
        }
      } catch (error) {
        console.error('Failed to search by category:', error);
      }
    }

    function renderProjects(container, projects) {
      if (projects.length === 0) {
        container.innerHTML = '<div class="empty-state">No projects found</div>';
        return;
      }

      container.innerHTML = projects.map(project => `
        <div class="project-card">
          <div class="project-header">
            <a href="${project.url}" target="_blank" class="project-name">${project.fullName}</a>
            <span class="project-stars">&#9733; ${formatNumber(project.stars)}</span>
          </div>
          <p class="project-desc">${project.description || 'No description'}</p>
          <div class="project-meta">
            <span class="meta-item">
              <span class="language-dot" style="background: ${getLanguageColor(project.language)}"></span>
              ${project.language}
            </span>
            <span class="meta-item">&#9741; ${formatNumber(project.forks)}</span>
            ${project.license ? `<span class="meta-item">&#128220; ${project.license}</span>` : ''}
          </div>
          ${project.topics && project.topics.length > 0 ? `
            <div class="topics">
              ${project.topics.slice(0, 3).map(t => `<span class="topic-tag">${t}</span>`).join('')}
            </div>
          ` : ''}
          <a href="/?url=${encodeURIComponent(project.url)}" class="preview-btn">Preview</a>
        </div>
      `).join('');
    }

    function renderPagination(totalCount, page, perPage) {
      const totalPages = Math.ceil(totalCount / perPage);
      const container = document.getElementById('pagination');

      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      let html = '';

      if (page > 1) {
        html += `<button class="page-btn" onclick="goToPage(${page - 1})">Previous</button>`;
      }

      for (let i = Math.max(1, page - 2); i <= Math.min(totalPages, page + 2); i++) {
        html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }

      if (page < totalPages) {
        html += `<button class="page-btn" onclick="goToPage(${page + 1})">Next</button>`;
      }

      container.innerHTML = html;
    }

    async function goToPage(page) {
      currentPage = page;
      await performSearch();
      window.scrollTo(0, 0);
    }

    async function sortResults(sort) {
      currentSort = sort;
      currentPage = 1;

      document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      await performSearch();
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
      return num?.toString() || '0';
    }

    function getLanguageColor(language) {
      const colors = {
        'JavaScript': '#f1e05a',
        'TypeScript': '#3178c6',
        'Python': '#3572A5',
        'Go': '#00ADD8',
        'Rust': '#dea584',
        'Java': '#b07219',
        'Ruby': '#701516',
        'C++': '#f34b7d',
        'C': '#555555',
        'Swift': '#F05138',
        'Kotlin': '#A97BFF',
      };
      return colors[language] || '#8b949e';
    }

    init();
  </script>
</body>
</html>
