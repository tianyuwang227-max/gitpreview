<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitPreview - Discover Projects</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      min-height: 100vh;
      color: #e6edf3;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      margin-bottom: 30px;
      border-bottom: 1px solid #21262d;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, #58a6ff, #3fb950);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: #8b949e;
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #e6edf3;
    }

    .search-container {
      margin-bottom: 30px;
    }

    .search-box {
      display: flex;
      gap: 12px;
      background: #21262d;
      border-radius: 12px;
      padding: 16px;
    }

    .search-input {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      outline: none;
    }

    .search-input:focus {
      border-color: #58a6ff;
    }

    .btn {
      padding: 12px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(90deg, #238636, #2ea043);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
    }

    .btn-secondary {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
    }

    .btn-secondary:hover {
      background: #30363d;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title .icon {
      font-size: 1.5rem;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .category-card {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .category-card:hover {
      border-color: #58a6ff;
      transform: translateY(-4px);
    }

    .category-icon {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .category-name {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .category-desc {
      font-size: 0.85rem;
      color: #8b949e;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .project-card {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      transition: all 0.2s;
    }

    .project-card:hover {
      border-color: #58a6ff;
      transform: translateY(-4px);
    }

    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .project-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
    }

    .project-name:hover {
      text-decoration: underline;
    }

    .project-stars {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #e3b341;
      font-size: 0.9rem;
    }

    .project-desc {
      color: #8b949e;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .project-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      color: #8b949e;
    }

    .language-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .topics {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .topic-tag {
      padding: 2px 8px;
      background: #1f6feb22;
      border: 1px solid #1f6feb;
      border-radius: 12px;
      font-size: 0.75rem;
      color: #58a6ff;
    }

    .favorite-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px;
      transition: transform 0.2s;
    }

    .favorite-btn:hover {
      transform: scale(1.2);
    }

    .favorite-btn.active {
      color: #f85149;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }

    .spinner {
      border: 3px solid #30363d;
      border-top: 3px solid #58a6ff;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 8px 16px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 20px;
      color: #8b949e;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .tab:hover,
    .tab.active {
      background: #30363d;
      color: #e6edf3;
      border-color: #58a6ff;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
    }

    .page-btn {
      padding: 8px 16px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      cursor: pointer;
    }

    .page-btn:hover {
      background: #30363d;
    }

    .page-btn.active {
      background: #1f6feb;
      border-color: #1f6feb;
    }

    .favorites-section {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">GitPreview</div>
      <nav class="nav-links">
        <a href="/" class="active">Discover</a>
        <a href="/preview">Preview</a>
        <a href="/favorites">Favorites</a>
      </nav>
    </header>

    <div class="search-container">
      <div class="search-box">
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="Search GitHub repositories..."
        >
        <button class="btn btn-primary" onclick="handleSearch()">Search</button>
      </div>
    </div>

    <div id="favoritesSection" class="favorites-section" style="display: none;">
      <div class="section-title">
        <span class="icon">&#10084;</span>
        Your Favorites
      </div>
      <div id="favoritesList" class="projects-grid"></div>
    </div>

    <div class="section-title">
      <span class="icon">&#128293;</span>
      Trending Projects
    </div>

    <div class="tabs" id="languageTabs">
      <span class="tab active" onclick="filterByLanguage()">All</span>
      <span class="tab" onclick="filterByLanguage('javascript')">JavaScript</span>
      <span class="tab" onclick="filterByLanguage('typescript')">TypeScript</span>
      <span class="tab" onclick="filterByLanguage('python')">Python</span>
      <span class="tab" onclick="filterByLanguage('go')">Go</span>
      <span class="tab" onclick="filterByLanguage('rust')">Rust</span>
    </div>

    <div id="trendingProjects" class="projects-grid">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading trending projects...</p>
      </div>
    </div>

    <div class="section-title">
      <span class="icon">&#128193;</span>
      Browse by Category
    </div>

    <div id="categoriesGrid" class="categories-grid"></div>
  </div>

  <script>
    const API_BASE = '';
    let currentLanguage = '';
    let currentPage = 1;

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    async function init() {
      await Promise.all([
        loadTrending(),
        loadCategories(),
        loadFavorites(),
      ]);
    }

    async function loadTrending(language = '') {
      const container = document.getElementById('trendingProjects');
      container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading...</p></div>';

      try {
        const url = language
          ? `${API_BASE}/api/trending?language=${language}`
          : `${API_BASE}/api/trending`;

        const response = await fetch(url);
        const data = await response.json();

        if (data.success) {
          renderProjects(container, data.data.projects);
        } else {
          container.innerHTML = '<div class="empty-state">Failed to load trending projects</div>';
        }
      } catch (error) {
        container.innerHTML = '<div class="empty-state">Error loading projects</div>';
      }
    }

    async function loadCategories() {
      try {
        const response = await fetch(`${API_BASE}/api/categories`);
        const data = await response.json();

        if (data.success) {
          renderCategories(data.data.categories);
        }
      } catch (error) {
        console.error('Failed to load categories:', error);
      }
    }

    async function loadFavorites() {
      try {
        const response = await fetch(`${API_BASE}/api/favorites`);
        const data = await response.json();

        if (data.success && data.data.favorites.length > 0) {
          const section = document.getElementById('favoritesSection');
          const container = document.getElementById('favoritesList');
          section.style.display = 'block';
          renderProjects(container, data.data.favorites.map(f => f.project), true);
        }
      } catch (error) {
        console.error('Failed to load favorites:', error);
      }
    }

    function renderProjects(container, projects, showRemove = false) {
      if (projects.length === 0) {
        container.innerHTML = '<div class="empty-state">No projects found</div>';
        return;
      }

      container.innerHTML = projects.map(project => `
        <div class="project-card">
          <div class="project-header">
            <a href="${project.url}" target="_blank" class="project-name">${project.fullName}</a>
            <div style="display: flex; align-items: center; gap: 10px;">
              <span class="project-stars">&#9733; ${formatNumber(project.stars)}</span>
              <button class="favorite-btn" onclick="toggleFavorite('${project.fullName}')">
                &#9829;
              </button>
            </div>
          </div>
          <p class="project-desc">${project.description || 'No description'}</p>
          <div class="project-meta">
            <span class="meta-item">
              <span class="language-dot" style="background: ${getLanguageColor(project.language)}"></span>
              ${project.language}
            </span>
            <span class="meta-item">&#9741; ${formatNumber(project.forks)}</span>
            ${project.license ? `<span class="meta-item">&#128220; ${project.license}</span>` : ''}
          </div>
          ${project.topics && project.topics.length > 0 ? `
            <div class="topics">
              ${project.topics.slice(0, 3).map(t => `<span class="topic-tag">${t}</span>`).join('')}
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function renderCategories(categories) {
      const container = document.getElementById('categoriesGrid');
      container.innerHTML = categories.map(cat => `
        <div class="category-card" onclick="searchByCategory('${cat.id}')">
          <div class="category-icon">${cat.icon}</div>
          <div class="category-name">${cat.name}</div>
          <div class="category-desc">${cat.description}</div>
        </div>
      `).join('');
    }

    function filterByLanguage(language = '') {
      currentLanguage = language;
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      event.target.classList.add('active');
      loadTrending(language);
    }

    async function handleSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      window.location.href = `/search?q=${encodeURIComponent(query)}`;
    }

    async function searchByCategory(categoryId) {
      window.location.href = `/search?category=${categoryId}`;
    }

    async function toggleFavorite(fullName) {
      try {
        const checkResponse = await fetch(`${API_BASE}/api/favorites/check/${fullName.replace('/', '/')}`);
        const checkData = await checkResponse.json();

        if (checkData.success && checkData.data.isFavorite) {
          await fetch(`${API_BASE}/api/favorites/${fullName.replace('/', '/')}`, { method: 'DELETE' });
        } else {
          await fetch(`${API_BASE}/api/favorites`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fullName }),
          });
        }

        await loadFavorites();
      } catch (error) {
        console.error('Failed to toggle favorite:', error);
      }
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
      return num?.toString() || '0';
    }

    function getLanguageColor(language) {
      const colors = {
        'JavaScript': '#f1e05a',
        'TypeScript': '#3178c6',
        'Python': '#3572A5',
        'Go': '#00ADD8',
        'Rust': '#dea584',
        'Java': '#b07219',
        'Ruby': '#701516',
        'C++': '#f34b7d',
        'C': '#555555',
        'Swift': '#F05138',
        'Kotlin': '#A97BFF',
      };
      return colors[language] || '#8b949e';
    }

    init();
  </script>
</body>
</html>
