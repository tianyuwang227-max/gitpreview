<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitPreview - History</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      min-height: 100vh;
      color: #e6edf3;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      margin-bottom: 30px;
      border-bottom: 1px solid #21262d;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, #58a6ff, #3fb950);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: #8b949e;
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #e6edf3;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: #58a6ff;
    }

    .stat-label {
      font-size: 0.9rem;
      color: #8b949e;
      margin-top: 4px;
    }

    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .search-input {
      flex: 1;
      padding: 12px 16px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 1rem;
    }

    .search-input:focus {
      outline: none;
      border-color: #58a6ff;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(90deg, #238636, #2ea043);
      color: white;
    }

    .btn-danger {
      background: #f85149;
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-item {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.2s;
      cursor: pointer;
    }

    .history-item:hover {
      border-color: #58a6ff;
      transform: translateX(4px);
    }

    .history-thumbnail {
      width: 80px;
      height: 60px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .history-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .history-info {
      flex: 1;
      min-width: 0;
    }

    .history-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #58a6ff;
      margin-bottom: 4px;
    }

    .history-desc {
      color: #8b949e;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-meta {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      font-size: 0.85rem;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #8b949e;
    }

    .history-time {
      color: #484f58;
      font-size: 0.85rem;
      text-align: right;
      min-width: 100px;
    }

    .history-actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      padding: 8px;
      background: none;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #8b949e;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: #30363d;
      color: #e6edf3;
    }

    .empty-state {
      text-align: center;
      padding: 60px;
      color: #8b949e;
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-list {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .top-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #161b22;
    }

    .top-item:last-child {
      border-bottom: none;
    }

    .top-name {
      color: #e6edf3;
    }

    .top-count {
      color: #58a6ff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">GitPreview</div>
      <nav class="nav-links">
        <a href="/">Preview</a>
        <a href="/discover">Discover</a>
        <a href="/history" class="active">History</a>
      </nav>
    </header>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="section-title">
      <span>&#128337;</span>
      Recent Activity
    </div>

    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="Search history...">
      <button class="btn btn-primary" onclick="searchHistory()">Search</button>
      <button class="btn btn-danger" onclick="clearAllHistory()">Clear All</button>
    </div>

    <div class="history-list" id="historyList">
      <div class="empty-state">
        <div class="empty-state-icon">&#128337;</div>
        <p>No history yet</p>
        <p>Start previewing repositories to build your history</p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '';

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchHistory();
    });

    async function init() {
      await Promise.all([
        loadStats(),
        loadHistory(),
      ]);
    }

    async function loadStats() {
      try {
        const response = await fetch(`${API_BASE}/api/history/stats`);
        const data = await response.json();

        if (data.success) {
          renderStats(data.data);
        }
      } catch (error) {
        console.error('Failed to load stats:', error);
      }
    }

    async function loadHistory(query = '') {
      try {
        const url = query
          ? `${API_BASE}/api/history?q=${encodeURIComponent(query)}`
          : `${API_BASE}/api/history`;

        const response = await fetch(url);
        const data = await response.json();

        if (data.success) {
          renderHistory(data.data.entries);
        }
      } catch (error) {
        console.error('Failed to load history:', error);
      }
    }

    function renderStats(stats) {
      const grid = document.getElementById('statsGrid');
      grid.innerHTML = `
        <div class="stat-card">
          <div class="stat-value">${stats.totalVisits}</div>
          <div class="stat-label">Total Visits</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${stats.uniqueProjects}</div>
          <div class="stat-label">Unique Projects</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${stats.topLanguages.length}</div>
          <div class="stat-label">Languages</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${stats.topOwners.length}</div>
          <div class="stat-label">Organizations</div>
        </div>
      `;
    }

    function renderHistory(entries) {
      const container = document.getElementById('historyList');

      if (entries.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">&#128337;</div>
            <p>No history found</p>
          </div>
        `;
        return;
      }

      container.innerHTML = entries.map(entry => `
        <div class="history-item" onclick="window.location='/?url=${encodeURIComponent(entry.url)}'">
          <div class="history-thumbnail">
            ${entry.thumbnailPath
              ? `<img src="${entry.thumbnailPath}" alt="${entry.name}">`
              : `<div style="width:100%;height:100%;background:#30363d;display:flex;align-items:center;justify-content:center;">&#128337;</div>`
            }
          </div>
          <div class="history-info">
            <div class="history-name">${entry.fullName}</div>
            <div class="history-desc">${entry.description || 'No description'}</div>
            <div class="history-meta">
              <span class="meta-item">
                <span>&#11088;</span>
                ${formatNumber(entry.stars)}
              </span>
              <span class="meta-item">
                <span>&#128196;</span>
                ${entry.language}
              </span>
              <span class="meta-item">
                ${entry.previewType === 'live' ? '&#128994; Live' : '&#128247; Screenshot'}
              </span>
            </div>
          </div>
          <div class="history-time">
            ${formatTime(entry.visitedAt)}
          </div>
          <div class="history-actions">
            <button class="btn-icon" onclick="event.stopPropagation(); removeEntry('${entry.id}')" title="Remove">
              &#128465;
            </button>
          </div>
        </div>
      `).join('');
    }

    async function searchHistory() {
      const query = document.getElementById('searchInput').value.trim();
      await loadHistory(query);
    }

    async function removeEntry(id) {
      try {
        await fetch(`${API_BASE}/api/history/${id}`, { method: 'DELETE' });
        await loadHistory();
        await loadStats();
      } catch (error) {
        console.error('Failed to remove entry:', error);
      }
    }

    async function clearAllHistory() {
      if (!confirm('Are you sure you want to clear all history?')) return;

      try {
        await fetch(`${API_BASE}/api/history`, { method: 'DELETE' });
        await loadHistory();
        await loadStats();
      } catch (error) {
        console.error('Failed to clear history:', error);
      }
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
      return num?.toString() || '0';
    }

    function formatTime(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const diff = now - date;

      if (diff < 60000) return 'Just now';
      if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
      if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
      if (diff < 604800000) return `${Math.floor(diff / 86400000)}d ago`;

      return date.toLocaleDateString();
    }

    init();
  </script>
</body>
</html>
